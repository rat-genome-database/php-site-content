<HTML>
<HEAD>
<LINK rel="stylesheet" type="text/css" href="stylesheet/rgd_styles.css">
<LINK rel="stylesheet" type="text/css" href="stylesheet/stylesheet.css">
<link rel="stylesheet" href="/OntoSolr/files/jquery.autocomplete.css" type="text/css" />
<META http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<TITLE>{{pageTitle}}</TITLE>

{{headContent}}

</HEAD>
<BODY bgcolor="#F9FCFF" text="#333333" alink="#3399FF" vlink="#000099"
	Links="#0033FF" leftmargin="0" topmargin="0" marginwidth="0"
	marginheight="0">
<TABLE width="100%" border="0" cellspacing="0" cellpadding="0">
	<TR align="left">
		<TD width="10" valign="top" background='images/header-bkgd.gif'><IMG
			src='images/shim.gif' width="10" height="1"></TD>
		<TD width="220" valign="top" background='images/header-bkgd.gif'><IMG
			src='images/rgd-logo.gif' width="220" height="89" border="0"
			usemap="#Mapheader"></TD>
		<TD width="280" valign="top" background='images/header-bkgd.gif'>

		<IMG src='images/header-submitdata.gif' width="280" height="89"
			border="0"></TD>

		<TD width="100%" valign="top" background='images/header-bkgd.gif'><IMG
			src='images/shim.gif' width="20" height="1"></TD>
		<TD width="280" valign="middle" background='images/header-bkgd.gif'>&nbsp;</TD>
		<TD width="20" valign="top" background='images/header-bkgd.gif'><IMG
			src='images/shim.gif' width="20" height="1"></TD>
	</TR>
</TABLE>
<MAP name="Mapheader">
	<AREA shape="rect" coords="92,25,218,72" href='?' alt="RGD Home">
</MAP>



<TABLE align="center" border="0" cellpadding="0" cellspacing="0"
	width='95%'>
	<TR>
		<TD align="center" colspan="2" class="headerpanel"></TD>
	</TR>
	<TR>
		<TD colspan="2" align="center" class="menupanel">[[menu]]</TD>
	</TR>
	<TR>
		<TD valign="top" align="center" width="20%" class="leftpanel">[[curationPanel]]<br/> [[annotPanel]]<br>[[adminPanel]]</TD>
		<TD class="mainpanel" valign="top" width="80%">{{statusMessage}}
		<DIV align="center"><B>{{pageTitle}}</B></DIV>
		<BR />
		{{body}}</TD>
	</TR>
	<TR>
		<TD align="center" colspan="2" class="footer">[[footerBar]]</TD>
	</TR>
</TABLE>

<script type="text/javascript">
var uservoiceOptions = {
   /* required */
   key: 'rgd',
   host: 'rgd.uservoice.com',
   forum: '33675',
   showTab: true,
   /* optional */
   alignment: 'left',
   background_color:'#f00',
   text_color: 'white',
   hover_color: '#06C',
   lang: 'en'
};

function _loadUserVoice() {
   var s = document.createElement('script');
   s.setAttribute('type', 'text/javascript');
   s.setAttribute('src', ("https:" == document.location.protocol ? "https://" : "http://") + "cdn.uservoice.com/javascripts/widgets/tab.js");
   document.getElementsByTagName('head')[0].appendChild(s);
}
_loadSuper = window.onload;
window.onload = (typeof window.onload != 'function') ? _loadUserVoice : function() { _loadSuper(); _loadUserVoice(); }; 
</script>



</BODY>
</HTML>
